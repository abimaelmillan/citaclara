</defs><rect width="1240" height="660" fill="#fff"/><text x="30" y="38" font-size="19" font-weight="700" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Feature 4 · Sincronización con Google Calendar al agendar</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">La cita se guarda primero; después se crea el evento en el calendario del profesional</text><line x1="128.33333333333331" y1="150" x2="128.33333333333331" y2="584" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="38" y="92" width="180.66666666666666" height="58" rx="10" fill="#e8eef9" stroke="#b9c8e6" stroke-width="1.5"/><text x="128.33333333333331" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#2d4f8f" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Paciente</text><text x="128.33333333333331" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">agenda pública</text><line x1="325" y1="150" x2="325" y2="584" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="234.66666666666666" y="92" width="180.66666666666666" height="58" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/><text x="325" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">API + booking</text><text x="325" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">public.controller</text><line x1="521.6666666666666" y1="150" x2="521.6666666666666" y2="584" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="431.3333333333333" y="92" width="180.66666666666666" height="58" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/><text x="521.6666666666666" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">appointment-sync</text><text x="521.6666666666666" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">google-calendar.service</text><line x1="718.3333333333334" y1="150" x2="718.3333333333334" y2="584" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="628" y="92" width="180.66666666666666" height="58" rx="10" fill="#fdf3e1" stroke="#e3c27f" stroke-width="1.5"/><text x="718.3333333333334" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Google</text><text x="718.3333333333334" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">Calendar API v3</text><line x1="915" y1="150" x2="915" y2="584" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="824.6666666666666" y="92" width="180.66666666666666" height="58" rx="10" fill="#e3f3f1" stroke="#0f7b74" stroke-width="1.5"/><text x="915" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">MongoDB</text><text x="915" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">appointments · users</text><line x1="1111.6666666666665" y1="150" x2="1111.6666666666665" y2="584" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="1021.3333333333333" y="92" width="180.66666666666666" height="58" rx="10" fill="#efeafa" stroke="#c9bdea" stroke-width="1.5"/><text x="1111.6666666666665" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Socket.IO</text><text x="1111.6666666666665" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">/panel · /agenda</text><line x1="128.33333333333331" y1="198" x2="321" y2="198" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="136.33333333333331" y="191" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1. POST /api/public/professionals/:slug/appointments</text><line x1="325" y1="238" x2="911" y2="238" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="333" y="231" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2. valida horario libre, upsert del paciente, crea la cita</text><line x1="325" y1="278" x2="517.6666666666666" y2="278" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="333" y="271" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3. afterAppointmentChange(id, 'created')</text><line x1="521.6666666666666" y1="318" x2="911" y2="318" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="529.6666666666666" y="311" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4. ¿calendarConnected? lee tokens cifrados</text><line x1="521.6666666666666" y1="358" x2="714.3333333333334" y2="358" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#arrowAmber)"/><text x="529.6666666666666" y="351" font-size="12" font-weight="400" text-anchor="start" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5. POST oauth2/token (solo si el access token expiró)</text><line x1="521.6666666666666" y1="398" x2="714.3333333333334" y2="398" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#arrowAmber)"/><text x="529.6666666666666" y="391" font-size="12" font-weight="400" text-anchor="start" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">6. POST /calendars/primary/events</text><line x1="718.3333333333334" y1="438" x2="525.6666666666666" y2="438" stroke="#0f7b74" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowAccent)"/><text x="529.6666666666666" y="431" font-size="12" font-weight="400" text-anchor="start" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">7. 200 { id: googleEventId }</text><line x1="521.6666666666666" y1="478" x2="911" y2="478" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="529.6666666666666" y="471" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">8. updateOne: googleEventId + calendarSync = synced</text><line x1="521.6666666666666" y1="518" x2="1107.6666666666665" y2="518" stroke="#5b3f99" stroke-width="1.8" marker-end="url(#arrowViolet)"/><text x="529.6666666666666" y="511" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">9. emit appointment:changed / slots:changed</text><line x1="325" y1="558" x2="132.33333333333331" y2="558" stroke="#0f7b74" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowAccent)"/><text x="136.33333333333331" y="551" font-size="12" font-weight="400" text-anchor="start" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">10. 201 { appointment, manageToken, manageUrl }</text><text x="30" y="614" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Reprogramar → PATCH del evento · Cancelar → DELETE del evento (404/410 se consideran ya borrado).</text><text x="30" y="634" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Si Google falla: la cita se conserva y calendarSync = failed. Si el permiso fue revocado (invalid_grant): calendarConnected = false.</text></svg>