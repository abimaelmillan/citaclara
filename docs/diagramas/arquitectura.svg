if">Models</text><text x="360" y="657" font-size="11.5" font-weight="400" text-anchor="start" fill="#17232b" font-family="'SF Mono', Menlo, Consolas, monospace">User (+ google) · AppointmentType · Availability · Patient</text><text x="360" y="672" font-size="11.5" font-weight="400" text-anchor="start" fill="#17232b" font-family="'SF Mono', Menlo, Consolas, monospace">Appointment (+ googleEventId, calendarSync)</text><text x="360" y="692" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Esquemas Mongoose, índices y referencias</text><rect x="342" y="732" width="560" height="104" rx="10" fill="#efeafa" stroke="#c9bdea" stroke-width="1.5"/><text x="360" y="762" font-size="16" font-weight="700" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Realtime · Socket.IO</text><text x="360" y="788" font-size="11" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="'SF Mono', Menlo, Consolas, monospace">/panel (JWT) → room professional:{id} · /agenda (público) → room agenda:{id}</text><text x="360" y="812" font-size="13" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">appointment-sync emite appointment:changed y slots:changed después de guardar</text><path d="M352 540 H330 V784 H340" fill="none" stroke="#5b3f99" stroke-width="2" marker-end="url(#arrowViolet)"/><path d="M322 784 H292 V440" fill="none" stroke="#5b3f99" stroke-width="2" stroke-dasharray="6 4"/><line x1="292" y1="440" x2="264" y2="440" stroke="#5b3f99" stroke-width="2" marker-end="url(#arrowViolet)"/><line x1="292" y1="572" x2="264" y2="572" stroke="#5b3f99" stroke-width="2" marker-end="url(#arrowViolet)"/><text x="284" y="690" transform="rotate(-90 284 690)" font-size="11" font-weight="700" text-anchor="middle" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 