</defs><rect width="1240" height="700" fill="#fff"/><text x="30" y="38" font-size="19" font-weight="700" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Feature 6 · Agenda en tiempo real (Socket.IO)</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Otro paciente reserva: el panel del profesional y la agenda pública se actualizan sin recargar</text><line x1="128.33333333333331" y1="150" x2="128.33333333333331" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="38" y="92" width="180.66666666666666" height="58" rx="10" fill="#e8eef9" stroke="#b9c8e6" stroke-width="1.5"/><text x="128.33333333333331" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#2d4f8f" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Panel</text><text x="128.33333333333331" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">profesional</text><line x1="325" y1="150" x2="325" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="234.66666666666666" y="92" width="180.66666666666666" height="58" rx="10" fill="#e8eef9" stroke="#b9c8e6" stroke-width="1.5"/><text x="325" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#2d4f8f" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Agenda pública</text><text x="325" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">paciente A</text><line x1="521.6666666666666" y1="150" x2="521.6666666666666" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="431.3333333333333" y="92" width="180.66666666666666" height="58" rx="10" fill="#efeafa" stroke="#c9bdea" stroke-width="1.5"/><text x="521.6666666666666" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Socket.IO</text><text x="521.6666666666666" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">/panel · /agenda</text><line x1="718.3333333333334" y1="150" x2="718.3333333333334" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="628" y="92" width="180.66666666666666" height="58" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/><text x="718.3333333333334" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">API + Services</text><text x="718.3333333333334" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">booking · appointment-sync</text><line x1="915" y1="150" x2="915" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="824.6666666666666" y="92" width="180.66666666666666" height="58" rx="10" fill="#e3f3f1" stroke="#0f7b74" stroke-width="1.5"/><text x="915" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">MongoDB</text><text x="915" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">appointments</text><line x1="1111.6666666666665" y1="150" x2="1111.6666666666665" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="1021.3333333333333" y="92" width="180.66666666666666" height="58" rx="10" fill="#e8eef9" stroke="#b9c8e6" stroke-width="1.5"/><text x="1111.6666666666665" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#2d4f8f" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Paciente B</text><text x="1111.6666666666665" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">otro navegador</text><line x1="128.33333333333331" y1="198" x2="517.6666666666666" y2="198" stroke="#5b3f99" stroke-width="1.8" marker-end="url(#arrowViolet)"/><text x="136.33333333333331" y="191" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1. connect /panel  { auth: { token: JWT } }</text><path d="M521.6666666666666 230 h34 v16 h-30" fill="none" stroke="#5b3f99" stroke-width="1.8" marker-end="url(#arrowViolet)"/><text x="563.6666666666666" y="242" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2. middleware verifica JWT → room professional:{id}</text><line x1="325" y1="278" x2="517.6666666666666" y2="278" stroke="#5b3f99" stroke-width="1.8" marker-end="url(#arrowViolet)"/><text x="333" y="271" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3. connect /agenda → emit agenda:watch { slug }</text><line x1="521.6666666666666" y1="318" x2="329" y2="318" stroke="#0f7b74" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowAccent)"/><text x="333" y="311" font-size="12" font-weight="400" text-anchor="start" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4. ack { ok: true } → room agenda:{id}</text><line x1="1111.6666666666665" y1="358" x2="722.3333333333334" y2="358" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="726.3333333333334" y="351" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5. POST …/appointments (mismo día que ve A)</text><line x1="718.3333333333334" y1="398" x2="911" y2="398" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="726.3333333333334" y="391" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">6. guarda la cita</text><line x1="718.3333333333334" y1="438" x2="525.6666666666666" y2="438" stroke="#5b3f99" stroke-width="1.8" marker-end="url(#arrowViolet)"/><text x="529.6666666666666" y="431" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">7. emitAppointmentChange()</text><line x1="521.6666666666666" y1="478" x2="132.33333333333331" y2="478" stroke="#5b3f99" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowViolet)"/><text x="136.33333333333331" y="471" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">8. appointment:changed { change: 'created', appointment }</text><line x1="521.6666666666666" y1="518" x2="329" y2="518" stroke="#5b3f99" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowViolet)"/><text x="333" y="511" font-size="12" font-weight="400" text-anchor="start" fill="#5b3f99" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">9. slots:changed { dates: ['AAAA-MM-DD'] }</text><path d="M128.33333333333331 550 h34 v16 h-30" fill="none" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="170.33333333333331" y="562" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">10. muestra aviso y recarga GET /api/appointments</text><path d="M325 590 h34 v16 h-30" fill="none" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="367" y="602" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">11. recarga …/slots; si su horario se ocupó, avisa</text><text x="30" y="654" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Errores: token inválido o expirado → connect_error "UNAUTHORIZED" · slug inexistente → ack { ok: false, error: "PROFESSIONAL_NOT_FOUND" }.</text><text x="30" y="674" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Privacidad: la agenda pública solo recibe fechas, nunca datos de pacientes.</text></svg>