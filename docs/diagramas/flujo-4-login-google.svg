<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b0"/></marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7b74"/></marker>
  <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17232b"/></marker>
  <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3f99"/></marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
</defs><rect width="1240" height="700" fill="#fff"/><text x="30" y="38" font-size="19" font-weight="700" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Feature 4 · Inicio de sesión con Google (OAuth 2.0, authorization code)</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">El profesional entra con Google; la API valida el state, consulta a Google y guarda los tokens cifrados</text><line x1="148" y1="150" x2="148" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="38" y="92" width="220" height="58" rx="10" fill="#e8eef9" stroke="#b9c8e6" stroke-width="1.5"/><text x="148" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#2d4f8f" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Profesional</text><text x="148" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">navegador</text><line x1="384" y1="150" x2="384" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="274" y="92" width="220" height="58" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/><text x="384" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">API CitaClara</text><text x="384" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">google-auth.controller</text><line x1="620" y1="150" x2="620" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="510" y="92" width="220" height="58" rx="10" fill="#fff" stroke="#cfd8dd" stroke-width="1.5"/><text x="620" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Services</text><text x="620" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">google-auth · google-oauth</text><line x1="856" y1="150" x2="856" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="746" y="92" width="220" height="58" rx="10" fill="#fdf3e1" stroke="#e3c27f" stroke-width="1.5"/><text x="856" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Google</text><text x="856" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">OAuth 2.0 · OpenID</text><line x1="1092" y1="150" x2="1092" y2="624" stroke="#cfd8dd" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="982" y="92" width="220" height="58" rx="10" fill="#e3f3f1" stroke="#0f7b74" stroke-width="1.5"/><text x="1092" y="117" font-size="14" font-weight="700" text-anchor="middle" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">MongoDB</text><text x="1092" y="137" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5d6b75" font-family="'SF Mono', Menlo, Consolas, monospace">users</text><line x1="148" y1="198" x2="380" y2="198" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="156" y="191" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1. GET /api/auth/google  (clic en «Continuar con Google»)</text><path d="M384 230 h34 v16 h-30" fill="none" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="426" y="242" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2. genera state; guarda copia firmada en cookie httpOnly (10 min)</text><line x1="384" y1="278" x2="152" y2="278" stroke="#0f7b74" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowAccent)"/><text x="156" y="271" font-size="12" font-weight="400" text-anchor="start" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3. 302 → accounts.google.com (openid email profile calendar.events)</text><line x1="148" y1="318" x2="852" y2="318" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="156" y="311" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4. inicia sesión y acepta los permisos</text><line x1="856" y1="358" x2="388" y2="358" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#arrowAmber)"/><text x="392" y="351" font-size="12" font-weight="400" text-anchor="start" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5. 302 → GET /api/auth/google/callback?code&amp;state</text><line x1="384" y1="398" x2="616" y2="398" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="392" y="391" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">6. handleGoogleCallback(): verifica state vs cookie</text><line x1="620" y1="438" x2="852" y2="438" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#arrowAmber)"/><text x="628" y="431" font-size="12" font-weight="400" text-anchor="start" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">7. POST /token: code → access + refresh token</text><line x1="620" y1="478" x2="852" y2="478" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#arrowAmber)"/><text x="628" y="471" font-size="12" font-weight="400" text-anchor="start" fill="#8a5a00" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">8. GET /v1/userinfo: sub, email, email_verified</text><line x1="620" y1="518" x2="1088" y2="518" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="628" y="511" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">9. busca por google.id → por correo → crea profesional</text><line x1="620" y1="558" x2="1088" y2="558" stroke="#17232b" stroke-width="1.8" marker-end="url(#arrowInk)"/><text x="628" y="551" font-size="12" font-weight="400" text-anchor="start" fill="#17232b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">10. guarda google.* con tokens cifrados (AES-256-GCM)</text><line x1="384" y1="598" x2="152" y2="598" stroke="#0f7b74" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrowAccent)"/><text x="156" y="591" font-size="12" font-weight="400" text-anchor="start" fill="#0f7b74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">11. 302 → /panel#token=JWT  (el panel guarda el token)</text><text x="30" y="654" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Errores (redirigen a /panel#error=CÓDIGO): GOOGLE_ACCESS_DENIED · INVALID_OAUTH_STATE · INVALID_OAUTH_RESPONSE ·</text><text x="30" y="674" font-size="12.5" font-weight="400" text-anchor="start" fill="#5d6b75" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">GOOGLE_EMAIL_NOT_VERIFIED · GOOGLE_ACCOUNT_IN_USE · GOOGLE_NOT_CONFIGURED · GOOGLE_LOGIN_FAILED</text></svg>